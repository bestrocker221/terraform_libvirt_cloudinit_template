---

- hosts: all
  remote_user: user
  vars:
    ansible_ssh_private_key_file: "{{ privkeypath }}"
    packages:
      present:
        - wireguard
        - wireguard-tools
        - htop
        - git
        - python3
        - python3-pip
        - python3.11-venv
        - ipython3
        - jq
        - usbutils
        - 7zip
        - net-tools
        - dnsutils
        - chromium
        - brave-browser
        - firefox-esr 
        - zip
        - unzip
        - whois
        - pwgen
        - proxychains4
        - nmap
        - nfs-common
        - netcat
        - binwalk
        - ca-certificates
        - dos2unix
        #- enum4linux
        - fd-find
        - freerdp2-x11
        - gcc-12
        - gcc-12-base
        - build-essential
        - automake
        - make
        - ldap-utils
  roles:
    - upgrade
    - install_packages
    - install_sublimetext
    - install_oh-my-zsh
    - install_spice_guest_tools
    - install_xfce
    - reboot


